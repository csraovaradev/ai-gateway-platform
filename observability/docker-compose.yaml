# Local observability stack for the gateway (ADR-0004).
#
#   docker compose -f observability/docker-compose.yaml up -d
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 make run      # in gateway/
#
# Grafana http://127.0.0.1:3000 (dashboard "AI Gateway"), Prometheus :9090, Jaeger :16686.
# Prometheus scrapes the gateway on the host at AIGW_PORT (default 8080), e.g.
#   AIGW_PORT=8081 docker compose -f observability/docker-compose.yaml up -d

name: aigw-observability

configs:
  prometheus:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      rule_files:
        - /etc/prometheus/rules/rules.yaml
      scrape_configs:
        - job_name: aigw
          static_configs:
            - targets: ["host.docker.internal:${AIGW_PORT:-8080}"]

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus:/etc/prometheus/rules:ro
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  jaeger:
    image: jaegertracing/jaeger:2.1.0
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4318:4318"    # OTLP/HTTP from the gateway

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aigw.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, jaeger]
