{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "aigw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "aigw.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range concat $np.apiClientNamespaces $np.monitoringNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
    {{- with $np.ingressCidrs }}
    # A load balancer that targets pod IPs (the AWS ALB in IP mode) connects from these ranges.
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: http
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- with $np.vault.namespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: {{ $np.vault.port }}
    {{- end }}
    {{- if or $np.redis.namespace $np.redis.cidr }}
    - to:
        {{- if $np.redis.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.redis.namespace }}
        {{- else }}
        - ipBlock:
            cidr: {{ $np.redis.cidr }}
        {{- end }}
      ports:
        - port: {{ $np.redis.port }}
    {{- end }}
    {{- range $np.extraEgress }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
      ports:
        - port: {{ .port }}
    {{- end }}
    {{- if $np.httpsEgress }}
    - ports:
        - port: 443
    {{- end }}
{{- end }}
