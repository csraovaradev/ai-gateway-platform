# Example gateway policy for LOCAL DEVELOPMENT.
#
# The demo keys below are public on purpose (see README):
#   platform team: dev-platform-key
#   data team:     dev-data-key
# Never use them outside your laptop. Generate real keys with:
#   python -m aigw.keys <team>

models:
  # Echoes your message back. Works with no credentials.
  - name: mock-echo
    provider: mock

  # Amazon Bedrock via the Converse API. Uses your AWS credential chain in Phase 1.
  # Set upstream_model to a Bedrock model or inference-profile ID enabled in your account.
  - name: bedrock-claude
    provider: bedrock
    upstream_model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    region: us-west-2

  # Any OpenAI-compatible server: vLLM, Ollama, LiteLLM, or a hosted API.
  # Example below targets Ollama running on your Mac.
  - name: local-llama
    provider: openai_compat
    base_url: http://localhost:11434/v1
    upstream_model: llama3.2
    # api_key_env: UPSTREAM_API_KEY   # env var holding the upstream key, if needed

teams:
  - name: platform
    key_sha256:
      - 9831e20a4d38b6fdfa34285772c4b88de26d51134c15107cb941d53b70859e63
    allowed_models: ["*"]
    requests_per_minute: 120

  - name: data
    key_sha256:
      - 33ba9b2d29663d7a3a4043d971cd244b328042768f2dcb1a7ef430be104e8dd1
    allowed_models: [mock-echo, local-llama]
    requests_per_minute: 10
