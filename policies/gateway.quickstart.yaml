# Level 1 quickstart policy (docs/getting-started.md): `docker compose up` from the repo root.
# No cloud account needed: the model is a mock and the MCP server is the demo "jira" container.
#
# The demo keys are public on purpose and only for your laptop:
#   platform team: dev-platform-key      data team: dev-data-key

models:
  - name: mock-echo          # echoes your message back, in both the OpenAI and Anthropic APIs
    provider: mock

mcp_servers:
  - name: jira
    url: http://jira-mcp:9000/mcp

teams:
  - name: platform
    key_sha256:
      - 9831e20a4d38b6fdfa34285772c4b88de26d51134c15107cb941d53b70859e63
    allowed_models: ["*"]
    allowed_tools: ["*"]
    requests_per_minute: 120

  - name: data
    key_sha256:
      - 33ba9b2d29663d7a3a4043d971cd244b328042768f2dcb1a7ef430be104e8dd1
    allowed_models: [mock-echo]
    allowed_tools: ["jira/search", "jira/get_*"]   # read-only: delete_issue is hidden
    requests_per_minute: 10
