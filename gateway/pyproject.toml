[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aigw"
version = "0.1.0"
description = "AI Gateway: OpenAI-compatible LLM gateway with per-team policy and audit"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35"]
redis = ["redis>=5"]
dev = ["pytest>=8", "ruff>=0.6", "boto3>=1.35", "redis>=5"]
mcp-demo = ["mcp>=2"]

[tool.setuptools.packages.find]
include = ["aigw*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
