<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker>
    <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="a-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1400" height="850" rx="18" fill="#0b1220"/>
  <rect x="0.5" y="0.5" width="1399" height="849" rx="18" fill="none" stroke="#1e293b"/>

  <!-- Title -->
  <text x="40" y="58" fill="#f1f5f9" font-size="26" font-weight="700">AI Gateway Platform</text>
  <text x="40" y="86" fill="#94a3b8" font-size="14">Reference architecture · LLM + MCP gateway on Amazon EKS with zero static secrets</text>

  <!-- ========== GROUPS ========== -->
  <!-- Clients -->
  <rect x="40" y="120" width="230" height="570" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="60" y="150" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">CLIENTS</text>

  <!-- EKS cluster -->
  <rect x="300" y="120" width="610" height="570" rx="14" fill="#0d1a30" stroke="#2563eb" stroke-dasharray="7 5"/>
  <text x="320" y="150" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="1.5">AMAZON EKS · ai-gateway namespace</text>

  <!-- Model providers -->
  <rect x="950" y="120" width="410" height="270" rx="14" fill="#0b1f24" stroke="#115e59"/>
  <text x="970" y="150" fill="#2dd4bf" font-size="12" font-weight="700" letter-spacing="1.5">MODEL PROVIDERS</text>

  <!-- MCP servers -->
  <rect x="950" y="410" width="410" height="280" rx="14" fill="#1f160d" stroke="#7c2d12"/>
  <text x="970" y="440" fill="#fb923c" font-size="12" font-weight="700" letter-spacing="1.5">UPSTREAM MCP SERVERS</text>

  <!-- ========== EDGES (drawn before nodes) ========== -->
  <!-- Clients -> Gateway -->
  <path d="M250,236 C292,236 288,300 326,300" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#a-blue)"/>
  <path d="M250,376 C292,376 288,350 326,350" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#a-blue)"/>
  <path d="M250,516 C292,516 288,400 326,400" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#a-blue)"/>

  <!-- Gateway -> Router / Proxy -->
  <path d="M550,280 C600,280 600,235 646,235" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#a-teal)"/>
  <path d="M550,400 C600,400 600,435 646,435" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#a-orange)"/>

  <!-- Router -> Models, Proxy -> MCP -->
  <path d="M880,235 H946" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#a-teal)"/>
  <path d="M880,435 H946" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#a-orange)"/>

  <!-- Telemetry -->
  <path d="M550,452 C605,452 600,610 646,610" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#a-violet)"/>
  <path d="M765,490 V566" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#a-violet)"/>
  <path d="M880,610 H916 V770 H946" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#a-violet)"/>

  <!-- Credentials -->
  <path d="M440,480 V726" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a-yellow)"/>
  <text x="454" y="596" fill="#fde68a" font-size="12">Kubernetes auth</text>
  <text x="454" y="614" fill="#fde68a" font-size="12">→ dynamic secrets</text>

  <!-- ========== NODES ========== -->
  <!-- Clients -->
  <g filter="url(#shadow)">
    <rect x="60" y="200" width="190" height="72" rx="10" fill="#16233b" stroke="#334155"/>
    <rect x="60" y="200" width="190" height="72" rx="10" fill="none" stroke="#60a5fa" stroke-opacity="0.35"/>
    <rect x="60" y="340" width="190" height="72" rx="10" fill="#16233b" stroke="#334155"/>
    <rect x="60" y="480" width="190" height="72" rx="10" fill="#16233b" stroke="#334155"/>
  </g>
  <text x="78" y="230" fill="#e2e8f0" font-size="15" font-weight="600">Cursor / Claude Code</text>
  <text x="78" y="251" fill="#94a3b8" font-size="12">Developer IDEs</text>
  <text x="78" y="370" fill="#e2e8f0" font-size="15" font-weight="600">Agents &amp; services</text>
  <text x="78" y="391" fill="#94a3b8" font-size="12">OpenAI-compatible SDKs</text>
  <text x="78" y="510" fill="#e2e8f0" font-size="15" font-weight="600">CI/CD pipelines</text>
  <text x="78" y="531" fill="#94a3b8" font-size="12">Automation &amp; batch jobs</text>

  <!-- Gateway API -->
  <g filter="url(#shadow)">
    <rect x="330" y="220" width="220" height="260" rx="12" fill="#16233b" stroke="#60a5fa" stroke-width="1.5"/>
  </g>
  <rect x="330" y="220" width="220" height="6" rx="3" fill="#60a5fa"/>
  <text x="350" y="256" fill="#f1f5f9" font-size="17" font-weight="700">Gateway API</text>
  <text x="350" y="277" fill="#94a3b8" font-size="12">Single front door · auth · policy</text>
  <line x1="350" y1="292" x2="530" y2="292" stroke="#334155"/>
  <g fill="#cbd5e1" font-size="13">
    <text x="350" y="320"><tspan fill="#60a5fa">●</tspan>  SSO (OIDC) / API-key auth</text>
    <text x="350" y="348"><tspan fill="#60a5fa">●</tspan>  Model &amp; tool allowlists</text>
    <text x="350" y="376"><tspan fill="#60a5fa">●</tspan>  Rate limits &amp; token budgets</text>
    <text x="350" y="404"><tspan fill="#60a5fa">●</tspan>  Per-team cost attribution</text>
    <text x="350" y="432"><tspan fill="#60a5fa">●</tspan>  Structured audit log</text>
  </g>

  <!-- LLM Router -->
  <g filter="url(#shadow)">
    <rect x="650" y="180" width="230" height="110" rx="12" fill="#16233b" stroke="#2dd4bf" stroke-width="1.5"/>
  </g>
  <rect x="650" y="180" width="230" height="6" rx="3" fill="#2dd4bf"/>
  <text x="670" y="214" fill="#f1f5f9" font-size="16" font-weight="700">LLM Router</text>
  <text x="670" y="234" fill="#94a3b8" font-size="12">Streaming · timeouts · metering</text>
  <rect x="670" y="250" width="136" height="24" rx="12" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.7"/>
  <text x="684" y="266" fill="#fde68a" font-size="11.5" font-weight="600">short-lived creds</text>

  <!-- MCP Proxy -->
  <g filter="url(#shadow)">
    <rect x="650" y="380" width="230" height="110" rx="12" fill="#16233b" stroke="#fb923c" stroke-width="1.5"/>
  </g>
  <rect x="650" y="380" width="230" height="6" rx="3" fill="#fb923c"/>
  <text x="670" y="414" fill="#f1f5f9" font-size="16" font-weight="700">MCP Proxy</text>
  <text x="670" y="434" fill="#94a3b8" font-size="12">Session scoping · tool allowlists</text>
  <rect x="670" y="450" width="136" height="24" rx="12" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.7"/>
  <text x="684" y="466" fill="#fde68a" font-size="11.5" font-weight="600">short-lived creds</text>

  <!-- OTel Collector -->
  <g filter="url(#shadow)">
    <rect x="650" y="570" width="230" height="80" rx="12" fill="#16233b" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <rect x="650" y="570" width="230" height="6" rx="3" fill="#a78bfa"/>
  <text x="670" y="603" fill="#f1f5f9" font-size="16" font-weight="700">OpenTelemetry</text>
  <text x="670" y="624" fill="#94a3b8" font-size="12">OTLP traces · /metrics · audit</text>

  <!-- Model providers -->
  <g filter="url(#shadow)">
    <rect x="970" y="165" width="370" height="56" rx="10" fill="#132b30" stroke="#134e4a"/>
    <rect x="970" y="237" width="370" height="56" rx="10" fill="#132b30" stroke="#134e4a"/>
    <rect x="970" y="309" width="370" height="56" rx="10" fill="#132b30" stroke="#134e4a"/>
  </g>
  <text x="988" y="189" fill="#e2e8f0" font-size="14.5" font-weight="600">Amazon Bedrock</text>
  <text x="988" y="208" fill="#94a3b8" font-size="12">IAM via Vault AWS secrets engine (STS)</text>
  <text x="988" y="261" fill="#e2e8f0" font-size="14.5" font-weight="600">Hosted LLM APIs</text>
  <text x="988" y="280" fill="#94a3b8" font-size="12">Provider API keys leased from Vault</text>
  <text x="988" y="333" fill="#e2e8f0" font-size="14.5" font-weight="600">Self-hosted models</text>
  <text x="988" y="352" fill="#94a3b8" font-size="12">vLLM · Ollama (OpenAI-compatible)</text>

  <!-- MCP servers -->
  <g filter="url(#shadow)">
    <rect x="970" y="458" width="370" height="56" rx="10" fill="#2a1d12" stroke="#7c2d12"/>
    <rect x="970" y="530" width="370" height="56" rx="10" fill="#2a1d12" stroke="#7c2d12"/>
    <rect x="970" y="602" width="370" height="56" rx="10" fill="#2a1d12" stroke="#7c2d12"/>
  </g>
  <text x="988" y="482" fill="#e2e8f0" font-size="14.5" font-weight="600">Jira MCP</text>
  <text x="988" y="501" fill="#94a3b8" font-size="12">Search · read · per-team tool allowlist</text>
  <text x="988" y="554" fill="#e2e8f0" font-size="14.5" font-weight="600">Any Streamable HTTP server</text>
  <text x="988" y="573" fill="#94a3b8" font-size="12">Token from Vault KV · never the client key</text>
  <text x="988" y="626" fill="#e2e8f0" font-size="14.5" font-weight="600">Internal MCP servers</text>
  <text x="988" y="645" fill="#94a3b8" font-size="12">GitHub · wiki · internal tools</text>

  <!-- Vault -->
  <g filter="url(#shadow)">
    <rect x="320" y="730" width="260" height="80" rx="12" fill="#221d0b" stroke="#facc15" stroke-width="1.5"/>
  </g>
  <text x="340" y="763" fill="#fef9c3" font-size="16" font-weight="700">HashiCorp Vault</text>
  <text x="340" y="784" fill="#a8a29e" font-size="12">K8s auth · STS 15 min · KMS auto-unseal</text>

  <!-- Observability backend -->
  <g filter="url(#shadow)">
    <rect x="950" y="730" width="410" height="80" rx="12" fill="#1a1530" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <text x="970" y="763" fill="#ede9fe" font-size="16" font-weight="700">Observability backend</text>
  <text x="970" y="784" fill="#a1a1aa" font-size="12">Prometheus · Grafana · Jaeger · SLO alerts</text>

  <!-- Legend -->
  <rect x="620" y="730" width="280" height="80" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <line x1="640" y1="752" x2="680" y2="752" stroke="#cbd5e1" stroke-width="2"/>
  <text x="694" y="756" fill="#94a3b8" font-size="12">Request path</text>
  <line x1="640" y1="772" x2="680" y2="772" stroke="#facc15" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="694" y="776" fill="#94a3b8" font-size="12">Credential issuance</text>
  <line x1="640" y1="792" x2="680" y2="792" stroke="#a78bfa" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
  <text x="694" y="796" fill="#94a3b8" font-size="12">Telemetry</text>
</svg>
