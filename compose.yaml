# Level 1: try the gateway with nothing but Docker (docs/getting-started.md).
#
#   docker compose up --build          # or: make quickstart
#   AIGW_PORT=8081 docker compose up   # if port 8080 is taken
#
# Level 2 adds sign-in, Vault, Redis, real models, and dashboards: make local (compose.full.yaml).

name: aigw

services:
  gateway:
    build: ./gateway
    image: ai-gateway:local
    ports: ["127.0.0.1:${AIGW_PORT:-8080}:8080"]
    volumes:
      - ./policies/gateway.quickstart.yaml:/etc/aigw/gateway.yaml:ro
    depends_on: [jira-mcp]
    restart: unless-stopped

  # Demo MCP server with search, get_issue, and delete_issue (examples/mcp-demo).
  jira-mcp:
    build: ./examples/mcp-demo
    image: aigw-jira-mcp:local
    restart: unless-stopped
