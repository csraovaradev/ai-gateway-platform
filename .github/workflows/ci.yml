name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      AIGW_TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Build image
        run: docker build -t ai-gateway:${{ github.sha }} .

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt and validate
        run: |
          terraform fmt -check -recursive terraform
          for dir in terraform/*/; do
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint helm/aigw
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Prometheus SLO rules
        run: >-
          docker run --rm -v "$PWD/observability/prometheus:/rules:ro" --entrypoint promtool
          prom/prometheus:v3.1.0 check rules /rules/rules.yaml
      - name: Observability compose file and dashboard
        run: |
          docker compose -f observability/docker-compose.yaml config -q
          python3 -m json.tool observability/grafana/dashboards/aigw.json > /dev/null
