# Product panel
aigwEyebrow=AI control plane for the enterprise
aigwHeadline=One secure front door for every model and every tool.
aigwLede=Your engineers keep Claude Code, Cursor, and the SDKs they already use. Every call is authorized, metered, and audited, with no long-lived secrets anywhere.
aigwFeature1Title=Identity-first access
